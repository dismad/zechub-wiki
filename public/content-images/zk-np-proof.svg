<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" role="img" aria-label="A prover sends a witness w for a claim x to a verifier, who runs a check and accepts or rejects">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker></defs>
<text x="440" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">Claim x</text>
<line x1="440" y1="44" x2="160" y2="86" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<line x1="440" y1="44" x2="720" y2="86" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<rect x="60" y="90" width="200" height="90" rx="12" fill="#c7d2fe" stroke="#4338ca" stroke-width="2"/>
<text x="160.0" y="129.0" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">Prover</text>
<text x="160.0" y="155.0" text-anchor="middle" font-size="16" font-weight="400" fill="#0f172a" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">Holds a witness w</text>
<rect x="620" y="90" width="200" height="90" rx="12" fill="#a5f3fc" stroke="#0e7490" stroke-width="2"/>
<text x="720.0" y="129.0" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">Verifier</text>
<text x="720.0" y="155.0" text-anchor="middle" font-size="16" font-weight="400" fill="#0f172a" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">Runs V(x, w)</text>
<line x1="260" y1="135" x2="620" y2="135" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="440" y="124" text-anchor="middle" font-size="17" fill="#0f172a" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">Sends witness w</text>
<line x1="720" y1="180" x2="720" y2="214" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
<text x="720" y="238" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">Accept or reject</text>
<text x="160" y="214" text-anchor="middle" font-size="15" font-weight="400" fill="#475569" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">A true claim has a short witness.</text>
<text x="160" y="236" text-anchor="middle" font-size="15" font-weight="400" fill="#475569" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">A false claim has none.</text>
</svg>
