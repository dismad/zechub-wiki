<text x="745.0" y="157.0" text-anchor="middle" font-size="16" font-weight="400" fill="#0f172a" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">Probabilistic,</text>
<text x="745.0" y="181.0" text-anchor="middle" font-size="16" font-weight="400" fill="#0f172a" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif">polynomial time</text>
